name: semestral_segundo_ciclo
services:
  app:
    build:
      context: .
    working_dir: /app
    volumes:
      - ..:/app
    ports:
      - "127.0.0.1:8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000

  node:
    image: node:22
    working_dir: /app
    volumes:
      - ..:/app
    profiles: [tools]
